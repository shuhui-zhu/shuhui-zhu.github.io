<meta name="theme-color" content="#ffffff" />
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css" />
<style>
    .news-scroll {
        max-height: 18rem;
        overflow-y: auto;
        margin-bottom: 1.5em;
        padding-right: 0.75em;
        border: 1px solid var(--global-border-color, #d3d3d3);
        border-radius: 4px;
    }

    .news-scroll ul {
        margin: 0.75em 1em 0.75em 1.5em;
        padding: 0;
    }

    /* ===== Publications page (grouped by year) ===== */
    .pub-intro { color: #555; margin-bottom: 2rem; }
    .pub-intro .me { font-weight: 700; color: #1a1a1a; }

    .pub-year-group { display: flex; margin-bottom: 2.5rem; }
    .pub-year-rail { flex: 0 0 4.5rem; }
    .pub-year-label {
        position: sticky;
        top: 5.5rem;
        display: inline-block;
        font-size: 1.45rem;
        font-weight: 600;
        color: #b3b8bd;
    }
    .pub-year-items {
        flex: 1;
        min-width: 0;
        padding-left: 1.5rem;
        border-left: 1px solid #ececec;
        display: flex;
        flex-direction: column;
        gap: 1.9rem;
    }
    .pub-entry-title {
        font-size: 1.15rem;
        font-weight: 600;
        color: #1a1a1a;
        line-height: 1.3;
        margin: 0 0 0.25rem;
    }
    .pub-entry-authors { color: #555; font-size: 0.92rem; margin: 0 0 0.45rem; line-height: 1.5; }
    .pub-entry-authors .me, .pub-intro .me { font-weight: 700; color: #1a1a1a; }
    .pub-entry-venue { margin: 0 0 0.6rem; }
    .pub-tag {
        display: inline-block;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
    }
    .tag-accepted { background: #2f7f93; color: #fff; }
    .tag-review { background: #f1f3f4; color: #5f6368; border: 1px solid #e0e2e4; }
    .tag-thesis { background: #eef5f7; color: #1f6175; border: 1px solid #d4e6ec; }

    .pub-btns { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .page__content .pub-btn {
        display: inline-block;
        font-size: 0.84rem;
        color: #1f6175;
        background: #f4f9fb;
        border: 1px solid #d4e6ec;
        border-radius: 5px;
        padding: 0.22rem 0.7rem;
        text-decoration: none;
        transition: background 0.15s ease;
    }
    .page__content .pub-btn:hover { background: #e3f0f4; text-decoration: none; }

    @media (max-width: 600px) {
        .pub-year-rail { flex: 0 0 3rem; }
        .pub-year-label { font-size: 1.15rem; }
        .pub-year-items { padding-left: 1rem; }
    }
</style>
<link rel="icon" href="images/my_favicon.jpg" type="image/jpg" sizes="16x16">
